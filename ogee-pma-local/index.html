<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OGEE Millwork PMA</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>OGEE Millwork PMA</h1>
      <p class="subtitle">Standalone local project manager</p>
    </div>
    <div class="top-actions">
      <button id="modeBtn">Shop TV Mode</button>
      <button id="addJobBtn" class="primary">+ Add Job</button>
      <button id="resetBtn" class="danger ghost">Reset Preview Data</button>
    </div>
  </header>

  <section class="filters">
    <input id="searchInput" type="search" placeholder="Search jobs, clients, notes…" />
    <select id="priorityFilter"><option value="">All priorities</option></select>
    <select id="jobFilter"><option value="">All jobs</option></select>
    <select id="employeeFilter"><option value="">All employees</option></select>
  </section>

  <main id="board" class="board"></main>

  <dialog id="jobDialog" class="dialog">
    <form method="dialog" id="jobForm">
      <div class="dialog-head">
        <div>
          <h2 id="dialogTitle">Job Details</h2>
          <div id="dialogMeta" class="muted"></div>
        </div>
        <button value="cancel" class="icon-btn" aria-label="Close">×</button>
      </div>

      <div class="tabs">
        <button type="button" data-tab="details" class="tab active">Details</button>
        <button type="button" data-tab="subtasks" class="tab">Subtasks</button>
        <button type="button" data-tab="links" class="tab">Links</button>
      </div>

      <section data-panel="details" class="panel active">
        <div class="grid2">
          <label>Job name<input id="nameField" required /></label>
          <label>Client<input id="clientField" /></label>
          <label>Priority<select id="priorityField"></select></label>
          <label>Status<select id="statusField"></select></label>
          <label>Lead<select id="leadField"></select></label>
          <label>Due date<input id="dueField" type="date" /></label>
        </div>
        <label>Material readiness
          <select id="materialsField">
            <option value="Ready">Ready</option>
            <option value="Partial">Partial</option>
            <option value="Waiting">Waiting</option>
          </select>
        </label>
        <label>Notes<textarea id="notesField" rows="5"></textarea></label>
        <div class="workflow">
          <button type="button" data-workflow="In Progress" class="start">START</button>
          <button type="button" data-workflow="Blocked" class="blocked">BLOCKED</button>
          <button type="button" data-workflow="Complete" class="complete">COMPLETE</button>
        </div>
      </section>

      <section data-panel="subtasks" class="panel">
        <div id="subtaskList"></div>
        <div class="subtask-add">
          <input id="newSubtaskTitle" placeholder="New subtask" />
          <select id="newSubtaskEmployee"></select>
          <input id="newSubtaskDue" type="date" />
          <button type="button" id="addSubtaskBtn">Add</button>
        </div>
      </section>

      <section data-panel="links" class="panel">
        <label>Dropbox Job Folder<input id="dropboxField" placeholder="https://…" /></label>
        <label>ChatGPT Job Handoff<textarea id="handoffField" rows="8" placeholder="Paste project context, prompts, or handoff notes here"></textarea></label>
      </section>

      <div class="dialog-actions">
        <button type="button" id="deleteJobBtn" class="danger">Delete Job</button>
        <span class="spacer"></span>
        <button value="cancel">Cancel</button>
        <button value="default" id="saveJobBtn" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="js/jobs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
